<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>30DayMapChallenge 2026 · Ming Cao</title>
<style>
:root{--bg:#f8f8f5;--ink:#293b35;--muted:#596b61;--line:#e4e9e3;--focus:#34788a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:64px auto 0;padding:0 40px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:46px;line-height:1.2;margin:10px 0 18px}a{color:inherit;text-underline-offset:4px}a:focus-visible{outline:2px solid var(--focus);outline-offset:5px}.intro{max-width:720px;margin-bottom:76px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}.intro p{color:var(--muted);margin:0}.gallery{display:block}article{display:grid;grid-template-columns:minmax(0,.32fr) minmax(0,.68fr);gap:52px;align-items:center;padding:0 0 76px;margin:0 0 76px;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;min-width:0}article:last-child{margin-bottom:0;border-bottom:0}article header{min-width:0;padding:0}.day{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 14px}h2{font-size:32px;line-height:1.2;margin:0 0 19px}.description{font-size:14px;line-height:1.85;color:var(--muted);margin:0 0 19px}.tools{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 19px}.links{display:flex;flex-wrap:wrap;gap:9px 18px;font-size:11px;line-height:1.7}.media-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;align-items:center}.media-grid.dual{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}figure{margin:0;min-width:0}.cover-link{display:block;line-height:0;transition:filter 160ms ease}.cover-link:hover{filter:brightness(1.035)}.cover-link:focus-visible{outline:2px solid var(--focus);outline-offset:5px}img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}figcaption{font-size:11px;color:var(--muted);margin-top:9px;text-align:center}.withheld-media{min-height:150px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}.page-footer{font-size:11px;color:var(--muted);padding:0 0 42px}@media(prefers-color-scheme:dark){:root{--bg:#101a17;--ink:#e7eee8;--muted:#afbeb3;--line:#28382e;--focus:#92c9d3}}@media(max-width:1050px){main{padding:0 26px}article{gap:30px}h2{font-size:29px}.description{font-size:13px}}@media(max-width:760px){main{margin:36px auto 0;padding:0 20px}.intro{margin-bottom:52px}h1{font-size:38px}article{display:flex;flex-direction:column;align-items:stretch;gap:27px;margin-bottom:50px;padding-bottom:50px}article header{width:100%;max-width:580px}h2{font-size:30px;margin-bottom:15px}.description{font-size:14px;line-height:1.8;margin-bottom:16px}.day{margin-bottom:12px}.tools{margin-bottom:15px}.media-grid.dual{grid-template-columns:minmax(0,1fr);gap:24px}.withheld-media{min-height:70px;justify-content:flex-start}.page-footer{padding-bottom:28px}}@media(max-width:380px){main{padding:0 14px}h1{font-size:34px}h2{font-size:28px}}@media(prefers-reduced-motion:reduce){.cover-link{transition:none}}
</style></head><body><main><div class="intro"><div class="eyebrow">30 DAY MAP CHALLENGE 2026</div><h1>Map collection</h1><p>Maps and spatial illustrations by Ming Cao.</p></div><section class="gallery" aria-label="Completed maps"><!-- GALLERY_ENTRIES --></section><footer class="page-footer">Ming Cao · <a href="https://github.com/MingC404/30DayMapChallenge" target="_blank" rel="noopener noreferrer">Source, data credits &amp; methods</a></footer></main></body></html>
