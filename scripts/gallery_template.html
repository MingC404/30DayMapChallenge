<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>30DayMapChallenge 2026 · Ming Cao</title>
<style>
:root{--bg:#f8f8f5;--card:#fff;--ink:#293b35;--muted:#596b61;--line:#dfe5df;--frame:#eef0eb;--badge:#edf4ee;--focus:#34788a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:52px auto;padding:0 26px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:44px;line-height:1.2;margin:8px 0 16px}a{color:inherit;text-underline-offset:3px}a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.intro{max-width:720px;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.intro p{color:var(--muted);margin:10px 0}.summary{font-size:13px}.local-notice{padding:10px 14px;border:1px solid var(--line);font-size:13px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:stretch}article{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden}.card-meta{min-height:48px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.badge{font-size:10px;letter-spacing:.4px;border:1px solid var(--line);background:var(--badge);padding:3px 7px;border-radius:3px;white-space:nowrap}.badge.pending{background:transparent}.media-grid{aspect-ratio:3/2;background:var(--frame);display:grid;grid-template-columns:minmax(0,1fr);gap:0}.media-grid.dual{grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0;min-width:0;min-height:0;display:flex;flex-direction:column}.cover-link{display:flex;flex:1;min-height:0;overflow:hidden;align-items:center;justify-content:center;position:relative;outline-offset:-4px!important}.cover-link img{display:block;width:100%;height:100%;min-height:0;object-fit:contain;transition:transform 180ms ease,filter 180ms ease}.cover-link:hover img{transform:scale(1.015);filter:brightness(1.025)}.cover-link:focus-visible{outline:3px solid var(--focus);z-index:2}figcaption{font-size:10px;text-align:center;padding:3px;color:var(--muted)}article header{padding:21px 22px 23px;display:flex;flex-direction:column;flex:1}h2{font-size:26px;line-height:1.25;margin:0 0 12px}.description{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 14px}.tools{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 17px}.links{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:12px;margin-top:auto}.page-footer{font-size:12px;color:var(--muted);padding:38px 0 20px}@media(prefers-color-scheme:dark){:root{--bg:#101a17;--card:#19231f;--ink:#e7eee8;--muted:#afbeb3;--line:#34463b;--frame:#14201a;--badge:#21392b;--focus:#92c9d3}}@media(max-width:760px){main{margin:30px auto;padding:0 16px}.gallery{grid-template-columns:minmax(0,1fr);gap:22px}h1{font-size:36px}h2{font-size:25px}.intro{margin-bottom:25px}}@media(max-width:380px){main{padding:0 10px}.card-meta{padding:10px 12px;font-size:11px;gap:4px}.badge{font-size:9px}article header{padding:18px}.description{font-size:14px}}@media(prefers-reduced-motion:reduce){.cover-link img{transition:none}.cover-link:hover img{transform:none}}
.media-grid{position:relative}.media-grid>figure{position:absolute;inset:0}.media-grid.dual>figure:first-child{right:50%}.media-grid.dual>figure:nth-child(2){left:50%}.cover-link img{position:absolute;inset:0}.cover-link:hover img{transform:none;filter:brightness(1.04)}</style></head><body><main><div class="intro"><div class="eyebrow">30 Day Map Challenge 2026</div><h1>Map collection</h1><p>Maps and spatial illustrations by Ming Cao.</p><p class="summary"><!-- GALLERY_SUMMARY --></p><!-- LOCAL_REVIEW --></div><section class="gallery" aria-label="Completed maps"><!-- GALLERY_ENTRIES --></section><footer class="page-footer">Ming Cao · <a href="https://github.com/MingC404/30DayMapChallenge" target="_blank" rel="noopener noreferrer">Source, data credits &amp; methods</a></footer></main></body></html>
